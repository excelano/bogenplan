# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.2.0"

[locales."en-us"]
whats-new = """
Bogenplan now runs on iPad, with as many days side by side as fit, their sunrises and sunsets lined up. Short events stay readable when zoomed out, and the whole day fills the screen at full zoom-out.
"""
