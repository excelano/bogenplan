# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.4.1"

[locales."en-us"]
whats-new = """
An event you delete or change now updates on the day straight away. Bogenplan checks your calendar accounts for changes each time it opens, and pulling down at the top of the day checks again. The icon keeps its yellow Sun on daytime blue in dark mode.
"""
