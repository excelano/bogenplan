# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.4.0"

[locales."en-us"]
whats-new = """
Edit and delete events. Tap an event, then Edit, to change it or delete it in the iPhone's own event editor: title, time, location, notes, calendar, alerts and repeats. For a repeating event, the editor asks whether the change is for this event only or for all future events. Events in calendars that can't be changed, such as subscribed calendars, have no Edit button. Bogenplan also has a new icon: a yellow sun on daytime blue.
"""
