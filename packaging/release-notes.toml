# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.2.1"

[locales."en-us"]
whats-new = """
On iPad in landscape, the whole week shows at once and swipes a week at a time, in step with the week strip. All-day events take at most two rows, with the rest behind a "more" button. The date picker opens to the full month, and events in narrow columns stay inside them.
"""
