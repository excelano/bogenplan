# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "0.2.2"

[locales."en-us"]
whats-new = """
A new app icon: a calendar page whose face is the day's sky, from night through the twilights to daylight, with the ring and dot of solar noon at its centre. It has its own dark and tinted versions for the Home Screen.
"""
